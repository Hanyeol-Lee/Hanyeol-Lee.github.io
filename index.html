<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Hanyeol Lee의 자기소개 페이지입니다."
    />
    <title>Hanyeol Lee | 자기소개</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, Pretendard, "Noto Sans KR", sans-serif;
        background: #0f172a;
        color: #e2e8f0;
      }

      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; }

      main {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 32px 20px;
        background:
          radial-gradient(circle at 15% 10%, rgba(56, 189, 248, .18), transparent 32%),
          radial-gradient(circle at 85% 90%, rgba(129, 140, 248, .18), transparent 30%),
          #0f172a;
      }

      .card {
        width: min(100%, 720px);
        padding: clamp(32px, 7vw, 72px);
        border: 1px solid rgba(148, 163, 184, .22);
        border-radius: 28px;
        background: rgba(15, 23, 42, .76);
        box-shadow: 0 24px 80px rgba(2, 6, 23, .35);
        backdrop-filter: blur(16px);
      }

      .eyebrow {
        margin: 0 0 18px;
        color: #67e8f9;
        font-size: .85rem;
        font-weight: 700;
        letter-spacing: .14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        color: #f8fafc;
        font-size: clamp(2.3rem, 8vw, 5rem);
        line-height: 1;
        letter-spacing: -.06em;
      }

      .intro {
        max-width: 560px;
        margin: 24px 0 0;
        color: #cbd5e1;
        font-size: clamp(1.05rem, 2.5vw, 1.3rem);
        line-height: 1.8;
      }

      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin: 32px 0 0;
      }

      .tag {
        padding: 9px 14px;
        border-radius: 999px;
        background: rgba(103, 232, 249, .1);
        color: #a5f3fc;
        font-size: .9rem;
      }

      footer {
        margin-top: 48px;
        color: #94a3b8;
        font-size: .9rem;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card" aria-labelledby="title">
        <p class="eyebrow">Hello, world</p>
        <h1 id="title">안녕하세요,<br />이한열입니다.</h1>
        <p class="intro">
          저를 소개하는 페이지를 만들고 있습니다.<br />
          앞으로 제가 하는 일과 관심 있는 것들을 차근차근 담아볼게요.
        </p>
        <div class="tags" aria-label="관심 분야">
          <span class="tag">About me</span>
          <span class="tag">Projects</span>
          <span class="tag">Contact</span>
        </div>
        <footer>© 2026 Hanyeol Lee</footer>
      </section>
    </main>
  </body>
</html>
